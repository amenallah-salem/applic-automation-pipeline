services:
  postgres:
    # pgvector/pgvector is Postgres 16 with the `vector` extension preinstalled.
    # Open WebUI's vector store (VECTOR_DB=pgvector) needs this to avoid a
    # local sqlite-backed Chroma file. See db/init.sql for CREATE EXTENSION.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [appnet]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENWEBUI_URL: http://openwebui:8080
      # JSON array of origins the backend accepts. Defaults to
      # http://${APP_HOST}:${FRONTEND_PORT} so a single APP_HOST in .env is
      # enough. Override CORS_ORIGINS directly if you need multiple origins.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://${APP_HOST:-localhost}:${FRONTEND_PORT:-3000}"]}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [appnet]

  frontend:
    build:
      context: ./frontend
      args:
        # URL the BROWSER uses to reach the backend. Baked into the static
        # JS at build time, so must match the host in the browser address
        # bar. Defaults to http://${APP_HOST}:${BACKEND_PORT}. Override
        # VITE_API_BASE_URL directly to force a specific URL.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://${APP_HOST:-localhost}:${BACKEND_PORT:-8000}}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1 — nginx in this image binds IPv4-only and the alpine
      # busybox wget resolves `localhost` to ::1 first, giving a spurious
      # "connection refused".
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [appnet]

  openwebui:
    build:
      context: ./openwebui
      args:
        OPENWEBUI_REF: ${OPENWEBUI_REF:-main}
    restart: unless-stopped
    environment:
      # Application data (users, chats, files, config, ...) on the shared
      # Postgres (NOT the default SQLite).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${OPENWEBUI_DB:-openwebui}
      # RAG vector store on the same Postgres via pgvector, so there is NO
      # sqlite fallback anywhere (was: chroma at /app/backend/data/vector_db).
      # PGVECTOR_DB_URL defaults to DATABASE_URL; set explicitly for clarity.
      VECTOR_DB: pgvector
      PGVECTOR_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${OPENWEBUI_DB:-openwebui}
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY}
      # Browser-facing URL (used e.g. in OAuth redirects). Single APP_HOST
      # knob keeps every container on the same origin.
      WEBUI_URL: ${WEBUI_URL:-http://${APP_HOST:-localhost}:${OPENWEBUI_PORT:-3001}}
      # Big-file handling for RAG uploads (see openwebui/README.md).
      RAG_FILE_MAX_SIZE: ${RAG_FILE_MAX_SIZE:-500}
      RAG_FILE_MAX_COUNT: ${RAG_FILE_MAX_COUNT:-50}
    volumes:
      - openwebui_data:/app/backend/data
    ports:
      - "${OPENWEBUI_PORT:-3001}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks: [appnet]

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Single APP_HOST knob so n8n's self-links (e.g. webhook URLs it shows
      # in the editor) match the host your browser uses.
      N8N_HOST: ${APP_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${WEBHOOK_URL:-http://${APP_HOST:-localhost}:${N8N_PORT:-5678}/}
      GENERIC_TIMEZONE: ${TZ:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "${N8N_PORT:-5678}:5678"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [appnet]

volumes:
  postgres_data:
  openwebui_data:
  n8n_data:

networks:
  appnet:
    driver: bridge
